apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: ditda-discord
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          title: |-
            {{ if eq .Status "firing" }}🔥 {{ .CommonLabels.alertname }}{{ else }}✅ {{ .Status | toUpper }} {{ .CommonLabels.alertname }}{{ end }}
          message: |-
            {{ if and (eq .Status "firing") (eq .CommonLabels.severity "critical") }}@here {{ end }}
            {{ range .Alerts }}
            **{{ .Annotations.summary }}**
            {{ if .Annotations.description }}> {{ .Annotations.description }}{{ end }}
            {{ if .Labels.env }}📍 **Env** `{{ .Labels.env }}`{{ end }}{{ if .Labels.instance }}  ·  🖥️ **Instance** `{{ .Labels.instance }}`{{ end }}{{ if .Labels.service }}  ·  ⚙️ **Service** `{{ .Labels.service }}`{{ end }}{{ if .Labels.mountpoint }}  ·  💾 **Mount** `{{ .Labels.mountpoint }}`{{ end }}
            {{ if .Annotations.runbook }}📖 {{ .Annotations.runbook }}{{ end }}
            {{ end }}